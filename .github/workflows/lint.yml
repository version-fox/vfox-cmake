name: Lint

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.1'
          cache: false
      - name: Lint GitHub Actions workflows
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7 -color

  lint-go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.1'
          cache: false
      - name: Check gofmt
        run: test -z "$(gofmt -l .)"
        working-directory: tests/e2e
      - name: Run go vet
        run: go vet ./...
        working-directory: tests/e2e
      - name: Run Go unit tests
        run: go test -short ./...
        working-directory: tests/e2e

  lint-lua:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check Lua formatting
        uses: JohnnyMorganz/stylua-action@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          version: v2.5.2
          args: --check .
      - name: Install lua-language-server
        run: |
          curl --fail --silent --show-error --location \
            --output /tmp/luals.tar.gz \
            https://github.com/LuaLS/lua-language-server/releases/download/3.19.1/lua-language-server-3.19.1-linux-x64.tar.gz
          sudo mkdir --parents /opt/lua-language-server
          sudo tar --extract --gzip --file /tmp/luals.tar.gz --directory /opt/lua-language-server
          sudo ln --symbolic /opt/lua-language-server/bin/lua-language-server /usr/local/bin/lua-language-server
      - name: Check Lua
        run: lua-language-server --check . --checklevel=Warning
